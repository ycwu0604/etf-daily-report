name: ETF Slope Analysis

on:
  # 每天台北 20:00 (12:00 UTC) 跟 06:00 (22:00 UTC 當日),單獨跑分析
  schedule:
    - cron: '0 12 * * 1-5'   # 週一到週五 台北 20:00
    - cron: '0 22 * * 1-5'   # 週一到週五 台北 06:00
  # 手動觸發 — Actions 頁面按 Run workflow
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 從 R2 拿最新 DB(由 etf-daily.yml 維護)
      - name: Download DB from R2
        run: |
          python scripts/r2_sync.py download etf_data.db Ezmoney/etf_data.db
          if [ -f Ezmoney/etf_data.db ]; then
            echo "DB downloaded: $(wc -c < Ezmoney/etf_data.db) bytes"
          else
            echo "No DB found — exiting"
            exit 0
          fi

      # 跑斜率分析 → docs/index.html
      - name: Generate slope analysis HTML
        run: python analyze.py --db Ezmoney/etf_data.db --out docs/index.html

      # 把 docs/ 上傳成 GH Pages artifact(必須在 build job 跑,因 deploy job 重新 checkout 拿不到 docs/)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # 部署 artifact 到 GitHub Pages
  deploy-gh-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
