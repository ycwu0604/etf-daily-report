name: ETF Slope Analysis

on:
  # 每天台北 20:00 (12:00 UTC) 跟 06:00 (22:00 UTC 當日),單獨跑分析
  schedule:
    - cron: '0 12 * * 1-5'   # 週一到週五 台北 20:00
    - cron: '0 22 * * 1-5'   # 週一到週五 台北 06:00
  # 手動觸發 — Actions 頁面按 Run workflow
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 從 R2 拿最新 DB(由 etf-daily.yml 維護)
      - name: Download DB from R2
        run: |
          python scripts/r2_sync.py download etf_data.db Ezmoney/etf_data.db
          if [ -f Ezmoney/etf_data.db ]; then
            echo "DB downloaded: $(wc -c < Ezmoney/etf_data.db) bytes"
          else
            echo "No DB found — exiting"
            exit 0
          fi

      # 跑斜率分析 → docs/index.html
      - name: Generate slope analysis HTML
        run: python analyze.py --db Ezmoney/etf_data.db --out docs/index.html

      # 抓股價 + 技術分析 → docs/ta_report.html
      - name: Fetch stock prices
        run: python fetch_prices.py --db Ezmoney/etf_data.db
        timeout-minutes: 20

      # 抓自訂清單(watchlist.txt)股價, 5y 深歷史(供 E 訊號 MR/BBW 暖機)
      - name: Fetch watchlist prices
        run: python fetch_prices.py --db Ezmoney/etf_data.db --codes-file watchlist.txt --range 5y
        timeout-minutes: 10

      # 診斷: 2330 深挖 — 找 bbw_pct 為何 NaN(close 有無 null / bb 有無大量 NaN)
      - name: Diagnose 2330 bbw_pct
        run: |
          python - <<'PY'
          import sqlite3, numpy as np
          from ta_report import load_prices
          from position_advisor import precompute
          con = sqlite3.connect('Ezmoney/etf_data.db')
          df = load_prices(con, '2330')
          n = 0 if df is None else len(df)
          print('=== 2330 deep-dive  n=%d ===' % n)
          if df is not None:
              print('close  NaN=%d zeros=%d head=%s tail=%s' % (
                  int(df['close'].isna().sum()), int((df['close'] == 0).sum()),
                  df['close'].head(3).tolist(), df['close'].tail(3).tolist()))
              pc = precompute(df); dfi = pc['dfi']
              for col in ['bb_mid', 'bb_upper', 'bb_lower']:
                  s = dfi[col]
                  print('%-9s NaN=%d last=%s' % (col, int(s.isna().sum()),
                      None if s.isna().iloc[-1] else round(float(s.iloc[-1]), 3)))
              bbw, bbw_pct = pc['bbw'], pc['bbw_pct']
              print('bbw      NaN=%d valid=%d last5=%s' % (
                  int(np.isnan(bbw).sum()), int((~np.isnan(bbw)).sum()),
                  [None if np.isnan(x) else round(float(x), 4) for x in bbw[-5:]]))
              print('bbw_pct  NaN=%d last5=%s' % (
                  int(np.isnan(bbw_pct).sum()),
                  [None if np.isnan(x) else round(float(x), 3) for x in bbw_pct[-5:]]))
          PY

      - name: Generate TA report
        run: python ta_report.py --db Ezmoney/etf_data.db --out docs/ta_report.html
        timeout-minutes: 5

      # 定案 E advisor 訊號 → docs/e_report_full.html
      - name: Generate E report
        run: python e_report.py --db Ezmoney/etf_data.db --out docs/e_report_full.html
        timeout-minutes: 5

      # 自訂清單 E 訊號 → docs/watchlist.html (讀 watchlist.txt)
      - name: Generate watchlist report
        run: python watchlist_report.py --db Ezmoney/etf_data.db --out docs/watchlist.html
        timeout-minutes: 5

      # 產生 rotation.html（否則乾淨覆蓋部署會把它洗掉，造成 404）
      - name: Generate rotation report
        run: python rotation_report.py --db Ezmoney/etf_data.db --out docs/rotation.html
        timeout-minutes: 5

      # 上傳更新後的 DB 回 R2（含 rotation_history）
      - name: Upload DB to R2
        run: python scripts/r2_sync.py upload Ezmoney/etf_data.db etf_data.db

      # 把 docs/ 上傳成 GH Pages artifact(必須在 build job 跑,因 deploy job 重新 checkout 拿不到 docs/)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # Telegram 通知
      - name: Notify Telegram
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅"
          else
            STATUS="❌"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${STATUS} ${{ github.workflow }} | ${{ job.status }} | ${{ github.event_name }}"

  # 部署 artifact 到 GitHub Pages
  deploy-gh-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
